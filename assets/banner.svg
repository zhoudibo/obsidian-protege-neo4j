<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#152238"/>
      <stop offset="100%" stop-color="#1b2c47"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200"/>
    <path d="M80 0 V400 M200 0 V400 M320 0 V400 M440 0 V400 M560 0 V400 M680 0 V400 M800 0 V400 M920 0 V400 M1040 0 V400 M1160 0 V400"/>
  </g>

  <!-- title -->
  <text x="56" y="72" fill="#f1f5f9" font-size="40" font-weight="700" letter-spacing="0.5">Obsidian → Protégé → Neo4j</text>
  <text x="56" y="108" fill="#94a3b8" font-size="19" font-weight="400">三层知识库架构 · 把 Markdown 笔记变成可查询、可增量、可恢复的知识图谱</text>

  <!-- three layer cards -->
  <g>
    <!-- L1 -->
    <rect x="56" y="140" width="212" height="120" rx="12" fill="url(#panel)" stroke="url(#l1)" stroke-width="2.5"/>
    <rect x="56" y="140" width="212" height="4" rx="2" fill="url(#l1)"/>
    <text x="76" y="172" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">L1 · SOURCE OF TRUTH</text>
    <text x="76" y="204" fill="#f1f5f9" font-size="25" font-weight="700">Obsidian</text>
    <text x="76" y="228" fill="#cbd5e1" font-size="14">Markdown · frontmatter</text>
    <text x="76" y="248" fill="#cbd5e1" font-size="14">[[wikilink]] · 原文件不改写</text>

    <!-- L2 -->
    <rect x="300" y="140" width="212" height="120" rx="12" fill="url(#panel)" stroke="url(#l2)" stroke-width="2.5"/>
    <rect x="300" y="140" width="212" height="4" rx="2" fill="url(#l2)"/>
    <text x="320" y="172" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.4">L2 · SEMANTICS</text>
    <text x="320" y="204" fill="#f1f5f9" font-size="25" font-weight="700">Protégé / OWL</text>
    <text x="320" y="228" fill="#cbd5e1" font-size="14">类 · 对象属性 · 方向</text>
    <text x="320" y="248" fill="#cbd5e1" font-size="14">domain / range · SHACL</text>

    <!-- L3 -->
    <rect x="544" y="140" width="212" height="120" rx="12" fill="url(#panel)" stroke="url(#l3)" stroke-width="2.5"/>
    <rect x="544" y="140" width="212" height="4" rx="2" fill="url(#l3)"/>
    <text x="564" y="172" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1.4">L3 · QUERY</text>
    <text x="564" y="204" fill="#f1f5f9" font-size="25" font-weight="700">Neo4j</text>
    <text x="564" y="228" fill="#cbd5e1" font-size="14">节点 · 关系 · 约束</text>
    <text x="564" y="248" fill="#cbd5e1" font-size="14">全文索引 · 查询投影</text>
  </g>

  <!-- arrows between cards -->
  <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#ar)">
    <path d="M272 200 H294"/>
    <path d="M516 200 H538"/>
  </g>

  <!-- ETL / import labels under arrows -->
  <g>
    <rect x="262" y="264" width="42" height="20" rx="6" fill="#0b1220" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="283" y="278" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">ETL</text>
    <rect x="506" y="264" width="42" height="20" rx="6" fill="#0b1220" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="527" y="278" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">CSV</text>
  </g>

  <!-- bottom boundary note -->
  <g>
    <rect x="56" y="296" width="700" height="58" rx="10" fill="#0b1220" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="76" y="320" fill="#fbbf24" font-size="14" font-weight="700">关键边界</text>
    <text x="76" y="342" fill="#94a3b8" font-size="13.5">OWL 是业务语义标准，Neo4j 是运行查询投影 — Neo4j 是派生副本，丢了能从 Obsidian 重建</text>
  </g>

  <!-- right value panel -->
  <g>
    <rect x="788" y="46" width="356" height="308" rx="14" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
    <text x="812" y="80" fill="#f1f5f9" font-size="16" font-weight="700">五个零依赖脚本</text>
    <text x="812" y="100" fill="#64748b" font-size="12">Python 标准库 · 只读 vault</text>

    <g font-size="13.5" fill="#cbd5e1">
      <circle cx="818" cy="128" r="3.2" fill="#38bdf8"/>
      <text x="830" y="133">kb_etl.py — Obsidian → CSV</text>
      <circle cx="818" cy="158" r="3.2" fill="#a78bfa"/>
      <text x="830" y="163">prepare_import.py — 导入就绪</text>
      <circle cx="818" cy="188" r="3.2" fill="#34d399"/>
      <text x="830" y="193">owl_check.py — 本体检索</text>
      <circle cx="818" cy="218" r="3.2" fill="#f59e0b"/>
      <text x="830" y="223">kb_sync_plan.py — 增量规划</text>
      <circle cx="818" cy="248" r="3.2" fill="#fb7185"/>
      <text x="830" y="253">graph_verify.py — 备份核验</text>
    </g>

    <path d="M812 268 H1120" stroke="#334155" stroke-width="1"/>
    <text x="812" y="292" fill="#f1f5f9" font-size="13" font-weight="700">三个防呆机制</text>
    <g font-size="12.5" fill="#94a3b8">
      <text x="812" y="314">· 输出目录必须在 vault 外</text>
      <text x="812" y="334">· 标签不随文件自动删除</text>
      <text x="812" y="354">· 删除比例超阈值即停手</text>
    </g>
  </g>
</svg>
